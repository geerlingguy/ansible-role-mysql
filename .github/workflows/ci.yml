---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "0 1 * * 3"

defaults:
  run:
    working-directory: 'geerlingguy.mysql'

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: 'geerlingguy.mysql'

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'  # Can't go to 3.14+ until Ansible 13.x

      - name: Install test dependencies.
        run: pip3 install yamllint

      - name: Lint code.
        run: |
          yamllint .

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - rockylinux10
          - ubuntu2604
          - ubuntu2404
          - ubuntu2204
          - debian13
          - debian12
        playbook:
          - converge.yml
          - converge-mariadb.yml
        exclude:
          # Exclude distros which already default to MariaDB.
          - distro: rockylinux10
            playbook: converge-mariadb.yml
          - distro: debian12
            playbook: converge-mariadb.yml
          - distro: debian13
            playbook: converge-mariadb.yml
        include:
          # Regression test that sets a non-root default user. Targets MariaDB
          # 10.4+. Only test a selection of recent distros since it is overkill
          # to test this on all versions.
          - distro: rockylinux10
            playbook: converge-mariadb-nonroot.yml
          - distro: ubuntu2604
            playbook: converge-mariadb-nonroot.yml
          - distro: debian13
            playbook: converge-mariadb-nonroot.yml

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: 'geerlingguy.mysql'

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'  # Can't go to 3.14+ until Ansible 13.x

      - name: Install test dependencies.
        run: pip3 install ansible molecule molecule-plugins[docker] docker

      # See: https://github.com/geerlingguy/ansible-role-mysql/issues/422
      - name: Disable AppArmor on Debian.
        run: |
            set -x
            sudo apt-get update
            sudo apt-get install apparmor-profiles
            sudo ln -s /etc/apparmor.d/usr.sbin.mysqld /etc/apparmor.d/disable/
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld
        if: ${{ startsWith(matrix.distro, 'debian') }}

      - name: Run Molecule tests.
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
          MOLECULE_PLAYBOOK: ${{ matrix.playbook }}
